<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF0FF"/>
      <stop offset="100%" stop-color="#E2E4FB"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE7C2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="600" height="630" fill="url(#leftGrad)"/>
  <rect x="600" y="0" width="600" height="630" fill="url(#rightGrad)"/>

  <text x="600" y="90" text-anchor="middle" font-size="26" fill="#6B7280" letter-spacing="1">AWS STRANDS AGENTS VS LANGCHAIN</text>

  <!-- Left: LangChain badge -->
  <g transform="translate(300,240)">
    <circle cx="0" cy="0" r="86" fill="#FFFFFF" stroke="#4F46E5" stroke-width="4"/>
    <!-- chain link icon -->
    <g stroke="#4F46E5" stroke-width="10" fill="none" stroke-linecap="round">
      <rect x="-38" y="-16" width="40" height="32" rx="16" transform="rotate(-20)"/>
      <rect x="-2" y="-16" width="40" height="32" rx="16" transform="rotate(-20)"/>
    </g>
  </g>
  <text x="300" y="372" text-anchor="middle" font-size="34" font-weight="700" fill="#3730A3">LangChain</text>
  <text x="300" y="404" text-anchor="middle" font-size="18" fill="#6B7280">You draw the graph</text>

  <!-- Right: Strands badge -->
  <g transform="translate(900,240)">
    <circle cx="0" cy="0" r="86" fill="#FFFFFF" stroke="#FF9900" stroke-width="4"/>
    <!-- loop icon -->
    <g stroke="#FF9900" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M -40,10 A 40,40 0 1 1 40,10"/>
      <path d="M 30,-6 L 40,10 L 20,14" fill="none"/>
    </g>
  </g>
  <text x="900" y="372" text-anchor="middle" font-size="34" font-weight="700" fill="#232F3E">AWS Strands Agents</text>
  <text x="900" y="404" text-anchor="middle" font-size="18" fill="#6B7280">The model owns the loop</text>

  <!-- Center divider -->
  <line x1="600" y1="140" x2="600" y2="480" stroke="#D1D5DB" stroke-width="2"/>
  <circle cx="600" cy="310" r="34" fill="#111827"/>
  <text x="600" y="319" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">VS</text>

  <text x="600" y="540" text-anchor="middle" font-size="40" font-weight="800" fill="#111827">Are they the same thing?</text>
  <text x="600" y="580" text-anchor="middle" font-size="20" fill="#4B5563">A practical answer, from someone who shipped in one and evaluated the other.</text>
</svg>
