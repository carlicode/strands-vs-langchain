<svg viewBox="0 0 1300 800" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <rect width="1300" height="800" fill="#FFFFFF"/>
  <text x="650" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Both snippets, run for real</text>

  <!-- LEFT terminal: Strands, live -->
  <g transform="translate(40,70)">
    <rect x="0" y="0" width="580" height="690" rx="12" fill="#1E1E1E"/>
    <rect x="0" y="0" width="580" height="36" rx="12" fill="#2D2D2D"/>
    <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
    <circle cx="42" cy="18" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="18" r="6" fill="#27C93F"/>
    <text x="290" y="23" text-anchor="middle" font-size="13" fill="#B3B3B3">strands/multi_tool_agent.py</text>

    <circle cx="540" cy="18" r="5" fill="#27C93F"/>
    <text x="500" y="23" font-size="11" fill="#27C93F">live</text>

    <g font-size="14" fill="#D4D4D4">
      <text x="20" y="66"><tspan fill="#27C93F">$</tspan> <tspan fill="#9CDCFE">python strands/multi_tool_agent.py</tspan></text>

      <text x="20" y="100" fill="#CE9178">I'll look up both the weather in Santa Cruz</text>
      <text x="20" y="120" fill="#CE9178">and the currency conversion simultaneously</text>
      <text x="20" y="140" fill="#CE9178">for you!</text>

      <text x="20" y="174" fill="#4EC9B0">Tool #1: get_weather</text>
      <text x="20" y="196" fill="#4EC9B0">Tool #2: convert_currency</text>

      <text x="20" y="230" fill="#D4D4D4">Here's everything you need to know</text>
      <text x="20" y="250" fill="#D4D4D4">before your trip to Santa Cruz:</text>

      <text x="20" y="284" fill="#DCDCAA">Weather: sunny and warm at 24°C —</text>
      <text x="20" y="304" fill="#DCDCAA">great travel weather!</text>

      <text x="20" y="338" fill="#DCDCAA">Currency: 100 USD converts to 696.00 BOB</text>

      <text x="20" y="372" fill="#D4D4D4">Enjoy your trip to Santa Cruz!</text>

      <text x="20" y="410" fill="#6A9955"># agent() streams this live — no</text>
      <text x="20" y="430" fill="#6A9955"># graph, no executor, no extra print()</text>

      <text x="20" y="460"><tspan fill="#27C93F">$</tspan><tspan fill="#8F8F8F"> _</tspan></text>
    </g>
  </g>

  <!-- RIGHT terminal: LangChain, do it yourself -->
  <g transform="translate(660,70)">
    <rect x="0" y="0" width="600" height="690" rx="12" fill="#1E1E1E" opacity="0.94"/>
    <rect x="0" y="0" width="600" height="36" rx="12" fill="#2D2D2D"/>
    <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
    <circle cx="42" cy="18" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="18" r="6" fill="#27C93F"/>
    <text x="300" y="23" text-anchor="middle" font-size="13" fill="#B3B3B3">langchain/multi_tool_agent.py</text>
    <circle cx="572" cy="18" r="5" fill="#FFBD2E"/>
    <text x="520" y="23" font-size="11" fill="#FFBD2E">your key</text>

    <g font-size="14" fill="#D4D4D4">
      <text x="20" y="66"><tspan fill="#27C93F">$</tspan> <tspan fill="#9CDCFE">cp .env.example .env</tspan></text>
      <text x="20" y="92"><tspan fill="#6A9955"># add your OPENAI_API_KEY, then:</tspan></text>

      <text x="20" y="126"><tspan fill="#27C93F">$</tspan> <tspan fill="#9CDCFE">python langchain/multi_tool_agent.py</tspan></text>

      <text x="20" y="170" fill="#8F8F8F">…same prompt as Strands, but first</text>
      <text x="20" y="190" fill="#8F8F8F">it has to build a ChatPromptTemplate,</text>
      <text x="20" y="210" fill="#8F8F8F">a scratchpad placeholder, and wrap</text>
      <text x="20" y="230" fill="#8F8F8F">everything in an AgentExecutor —</text>
      <text x="20" y="250" fill="#8F8F8F">before it ever calls a tool.</text>

      <text x="20" y="294" fill="#6A9955"># run this yourself once your key is</text>
      <text x="20" y="314" fill="#6A9955"># in .env — output will look similar,</text>
      <text x="20" y="334" fill="#6A9955"># wrapped in result["output"]</text>

      <text x="20" y="440"><tspan fill="#27C93F">$</tspan><tspan fill="#8F8F8F"> _</tspan></text>
    </g>
  </g>
</svg>
